name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx ng build --base-href /angular-material-cdk-showcase/

      # SPA client-side routing fallback: GitHub Pages serves static files
      # only, so a direct load of e.g. /call-board 404s unless 404.html
      # also serves index.html, letting Angular's router take over.
      - run: cp dist/angular-material-cdk-showcase/browser/index.html dist/angular-material-cdk-showcase/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular-material-cdk-showcase/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
