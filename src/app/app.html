<mat-sidenav-container class="shell">
  <mat-sidenav #sidenav [mode]="sidenavMode()" [opened]="sidenavOpened()" class="shell-nav">
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar color="primary" class="shell-toolbar">
      @if (sidenavMode() === 'over') {
        <button mat-icon-button aria-label="Toggle navigation" (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }

      <span class="shell-title">{{ title() }}</span>
      <span class="shell-spacer"></span>

      <mat-form-field appearance="outline" class="theme-select" subscriptSizing="dynamic">
        <mat-select
          [value]="themeService.colorTheme()"
          (selectionChange)="onColorThemeChange($event.value)"
          aria-label="Color theme"
        >
          <mat-option value="indigo">Indigo</mat-option>
          <mat-option value="teal">Teal</mat-option>
        </mat-select>
      </mat-form-field>

      <button
        mat-icon-button
        [matTooltip]="
          themeService.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
        "
        [attr.aria-label]="
          themeService.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
        "
        (click)="themeService.toggleMode()"
      >
        <mat-icon>{{ themeService.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <app-user-menu />
    </mat-toolbar>

    <main class="shell-main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
