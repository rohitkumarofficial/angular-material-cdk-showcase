<section class="intro">
  <h1>Modal Dialog</h1>
  <p>
    A centered, backdrop-dismissible modal built on <code>@angular/cdk/dialog</code>'s
    <code>Dialog</code> service &mdash; CDK's own dialog primitive (what <code>MatDialog</code> is
    itself built on), used here directly instead. Closes on the X button, a backdrop click, or Esc.
  </p>
</section>

<button mat-flat-button color="primary" (click)="openSettings()">
  <mat-icon>settings</mat-icon>
  Open Settings
</button>
